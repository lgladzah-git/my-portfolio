

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Product Landing Page</title>
    <style>
        body { font-family: sans-serif; margin: 0; text-align: center; background: #f4f4f9; color: #333; }
        header { padding: 80px 20px; background: #24292e; color: white; }
        h1 { margin: 0 0 10px; font-size: 2.5rem; }
        p { font-size: 1.2rem; color: #666; }
        header p { color: #adb5bd; }
        .cta-btn { display: inline-block; padding: 12px 24px; margin-top: 20px; background: #2da44e; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
        .features { display: flex; justify-content: center; gap: 30px; padding: 50px 20px; max-width: 800px; margin: 0 auto; flex-wrap: wrap; }
        .card { flex: 1; min-width: 200px; background: white; padding: 20px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <header>
        <h1>Imagine a Better Product</h1>
        <p>The ultimate solution to simplify your daily workflow.</p>
        <a href="#" class="cta-btn">Get Started Free</a>
    </header>

    <section class="features">
        <div class="card">
            <h3>⚡ Fast</h3>
            <p>Loads instantly anywhere in the world.</p>
        </div>
        <div class="card">
            <h3>🔒 Secure</h3>
            <p>Your data is protected by default.</p>
        </div>
        <div class="card">
            <h3>🎨 Easy</h3>
            <p>Simple interface designed for everyone.</p>
        </div>
    </section>

</body>
</html>
